apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentiment
  namespace: monitoring
  labels: {release: prometheus}
spec:
  namespaceSelector:
    matchNames: [sentiment]
  selector:
    matchLabels: {app: sentiment-metrics}
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
